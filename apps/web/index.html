<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; connect-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data: https:; media-src 'self' blob: data: https:; worker-src 'self' blob:" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A private, browser-only Markdown and QMD workspace." />
    <meta name="theme-color" content="#006f62" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/markroot-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/markroot-180.png" sizes="180x180" />
    <link rel="mask-icon" href="/brand/markroot-mask.svg" color="#006f62" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Markroot</title>
    <script>
      (() => { const t = localStorage.getItem('markroot-theme'); const dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = dark ? 'dark' : 'light'; })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
