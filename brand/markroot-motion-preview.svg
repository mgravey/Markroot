<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .tile{transform-origin:256px 256px;animation:tile 2s cubic-bezier(.2,.9,.2,1) both}.seed{transform-origin:262px 399px;animation:seed 2s ease-out both}.draw{fill:none;stroke:#fff;stroke-width:32;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600}.roots{animation:roots 2s ease-out both}.stems{animation:stems 2s ease-out both}.bowl{animation:bowl 2s ease-out both}.cursor{opacity:0;animation:cursor-arrive 2s step-end both,cursor-blink 1.2s 2s step-end infinite}
    @keyframes tile{0%,5%{transform:scale(0)}22%{transform:scale(1.06)}33%,100%{transform:scale(1)}}
    @keyframes seed{0%{transform:scale(0)}9%{transform:scale(1.2)}18%{transform:scale(1)}30%,100%{transform:scale(0)}}
    @keyframes roots{0%,17%{stroke-dashoffset:600}53%,100%{stroke-dashoffset:0}}
    @keyframes stems{0%,37%{stroke-dashoffset:600}78%,100%{stroke-dashoffset:0}}
    @keyframes bowl{0%,61%{stroke-dashoffset:600}98%,100%{stroke-dashoffset:0}}
    @keyframes cursor-arrive{0%,92%{opacity:0}93%,100%{opacity:1}}
    @keyframes cursor-blink{0%,48%{opacity:1}49%,82%{opacity:.18}83%,100%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.tile,.seed,.roots,.stems,.bowl,.cursor{animation:none}.tile{transform:none}.seed{display:none}.draw{stroke-dashoffset:0}.cursor{opacity:1}}
  </style>
  <rect width="512" height="512" fill="#edf0ee"/>
  <path class="tile" fill="#006f62" d="M144 48h224c53 0 96 43 96 96v256c0 35-29 64-64 64H144c-53 0-96-43-96-96V144c0-53 43-96 96-96Z"/>
  <circle class="seed" cx="262" cy="399" r="15" fill="#ef9163"/>
  <g class="draw roots"><path d="M262 346 205 382M262 346v53M262 346l59 36"/></g>
  <g class="draw stems"><path d="M262 346V156M326 300V156"/></g>
  <path class="draw bowl" d="M326 156H232c-52 0-84 27-84 72s32 72 84 72h30"/>
  <path class="cursor" fill="#ef9163" d="M354 128h24v64h-24z"/>
</svg>
